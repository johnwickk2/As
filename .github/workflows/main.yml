name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "resources" | Out-Null
          Copy-Item $exe.FullName "resources\ffmpeg.exe"
      - name: Include bundled FFmpeg in package
        shell: pwsh
        run: |
          node -e "let p=require('./package.json'); p.build.extraResources=[{from:'resources/ffmpeg.exe',to:'ffmpeg.exe'}]; require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: Build installer and portable exe
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AI-TikTok-Studio-Windows
          path: release/*
